[project]
name = "agent-permission-gateway"
version = "0.1.0"
description = "A local agent permission boundary with persistent approvals and attack replay"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.1", "jinja2==3.1.6", "langgraph==1.2.18", "langgraph-checkpoint-sqlite==3.1.2", "openai==3.39.0", "python-dotenv==1.2.4"]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.3", "mypy==2.4.0", "playwright==1.64.1", "types-requests==2.33.0.20261006"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/apg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real browser smoke test"]
